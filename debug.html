<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Debugging Exercise</title>
</head>
<body>
    <h1>Dashboard Status</h1>
    <div id="display"></div>
 
    <script>
        // Weekly Goal: Calculate the total weekly task goal for a user.
        
        // Declare variables and values
        let userName = "Jane Doe";
        let dailyGoal = 5;
        // FIXED: Changed bonusTasks from a String to a Number.
        let bonusTasks = 2; 
 
        // Output message to console
        console.log("Checking status for: " + userName); 
 
        // Calculate weekly goal based on number of workdays (5) per week
        // FIXED: Corrected the misspelled variable name from dialyGoal to dailyGoal.
        // FIXED: Changed the multiplier from 15 to 5 because there are 5 workdays per week.
        let weeklyGoal = dailyGoal * 5;
 
        // Add bonusTasks to weeklyGoal. 
        // Note: Check for data type issues
        // FIXED: Changed the operator from subtraction (-) to addition (+) to include bonus tasks.
        let totalGoal = weeklyGoal + bonusTasks;
 
        // Output results to web page
        document.write("User: " + userName + "<br>");
        // FIXED: Moved totalGoal outside the quotation marks so its value is displayed.
        document.write("Total Weekly Goal: " + totalGoal);
 
    </script>
</body>
</html>
